name: MSFS 2024 unsigned test installer
on:
  push:
    branches: [msfs2024-experimental]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test app model
        working-directory: app
        run: npm test

      - name: Layer build dependencies
        uses: ./.github/actions/layer-dependencies

      - name: Build and stage OpenXR layer
        shell: pwsh
        run: |
          ./scripts/Build-Layer.ps1
          ./scripts/Stage-ReleasePayload.ps1

      - name: Build VectorXR app without installer
        working-directory: app
        run: npm run tauri:build -- --no-bundle

      - name: Build unsigned NSIS installer
        working-directory: app
        run: npm run tauri:bundle -- --bundles nsis
      - name: Prepare test installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter *.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer" }
          New-Item -ItemType Directory -Path test-package -Force | Out-Null
          $name = "VectorXR-0.21.0-PR146-unsigned-windows-x64-setup.exe"
          Copy-Item $installers[0].FullName "test-package/$name"
          $hash = Get-FileHash "test-package/$name" -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $name" | Set-Content "test-package/$name.sha256" -Encoding ascii
      - name: Upload unsigned test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VectorXR-0.21.0-PR146-unsigned-windows-x64
          path: test-package/
          if-no-files-found: error
          retention-days: 14
